name: Hola Mundo CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  saludo:
    name: Saludo de verificacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Saludar
        run: |
          echo "Hola Mundo desde GitHub Actions"
          echo "Repositorio  : $GITHUB_REPOSITORY"
          echo "Rama         : $GITHUB_REF_NAME"
          echo "Evento       : $GITHUB_EVENT_NAME"
          echo "Ejecutado por: $GITHUB_ACTOR"

      - name: Verificar estructura del proyecto
        run: |
          ls -la
          test -f pom.xml && echo "OK: pom.xml encontrado en la raiz"

      - name: Mostrar fecha
        run: date

  build:
    name: Compilar y probar ms-despacho
    runs-on: ubuntu-latest
    needs: saludo
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar, testear y verificar cobertura
        run: mvn -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
